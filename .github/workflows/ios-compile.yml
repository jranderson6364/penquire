# Compile-checks the Swift module (PencilCanvas) for free on a macOS runner, so Swift errors
# don't cost an EAS build. Unsigned simulator build; nothing is uploaded.
name: iOS compile check
on:
  push:
    branches: [main]
    paths:
      - 'modules/**'
      - 'package.json'
      - 'app.json'
      - '.github/workflows/ios-compile.yml'
  workflow_dispatch:

jobs:
  compile:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest installed Xcode (EAS builds with Swift 6.2; the default here is older)
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then echo "No Xcode 26+ on this runner image; need a newer macos image"; exit 1; fi
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          swift --version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate native project (not committed)
        run: npx expo prebuild --platform ios --no-install
      - name: Install pods
        working-directory: ios
        run: pod install
      - name: Resolve Swift packages (diagnostic)
        working-directory: ios
        run: |
          xcodebuild -resolvePackageDependencies -workspace Penquire.xcworkspace -scheme Penquire 2>&1 | tail -n 60 || true
      - name: Build for simulator (unsigned)
        working-directory: ios
        run: |
          set +e
          xcodebuild -workspace Penquire.xcworkspace -scheme Penquire             -sdk iphonesimulator -configuration Debug             -destination 'generic/platform=iOS Simulator'             CODE_SIGNING_ALLOWED=NO build > build.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            echo "=== errors ==="; grep -E "error:" build.log | sort -u | head -40
            echo "=== context around the first error ==="; n=$(grep -n -m1 "error:" build.log | cut -d: -f1); sed -n "$((n>45?n-45:1)),$((n+6))p" build.log | cut -c1-260
            echo "=== our module ==="; grep -n "PencilCanvas" build.log | grep -iE "error|warning" | cut -c1-260 | head -20
            echo "=== package resolution detail ==="; grep -A25 "Could not resolve package dependencies" build.log | cut -c1-300 | head -60
            echo "=== failed commands ==="; grep -A15 "The following build commands failed" build.log | cut -c1-300
          fi
          exit $status
